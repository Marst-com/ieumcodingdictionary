<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEUM CodingDictionary</title>
  <meta name="description" content="코딩 문자, 기호, 태그, 키워드, 연산자, 문법을 한곳에서 찾아보는 개발자용 사전">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32.png">
  <link rel="apple-touch-icon" href="public/favicon.png">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <a class="skip-link" href="#results">검색 결과로 건너뛰기</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="IEUM CodingDictionary 처음으로">
      <img class="brand-mark" src="public/mark.png" alt="IEUM 로고" width="480" height="157">
      <span class="brand-name">CodingDictionary</span>
    </a>

    <div class="searchbar" role="search">
      <div class="mode-tabs" role="tablist" aria-label="검색 방식">
        <button id="tab-word" class="mode-tab" role="tab" type="button" aria-selected="true">단어</button>
        <button id="tab-grammar" class="mode-tab" role="tab" type="button" aria-selected="false" tabindex="-1">문법</button>
      </div>
      <div class="searchbox">
        <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="단어 검색  예) ===   함수   &lt;div&gt;" aria-label="단어 검색" maxlength="100" disabled>
        <kbd class="search-hint" aria-hidden="true">/</kbd>
        <button id="q-clear" class="icon-btn search-clear" type="button" aria-label="검색어 지우기" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div id="account" class="account"></div>
  </header>

  <div class="app" id="app">
    <nav class="sidebar" id="sidebar" aria-label="언어와 종류"></nav>
    <main class="results" id="results" tabindex="-1" aria-label="검색 결과"></main>
    <section class="detail" id="detail" aria-label="상세 정보"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
